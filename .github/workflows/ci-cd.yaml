name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Short SHA
        id: vars
        run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/demo-web:${{ env.SHA_SHORT }}
            ${{ secrets.DOCKERHUB_USERNAME }}/demo-web:latest

  update-gitops-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps Repository
        uses: actions/checkout@v4
        with:
          repository: 'ligum/k8s-gitops-manifests'
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Update Image Tag in Deployment
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)
          sed -i "s|image: .*demo-web:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/demo-web:${SHA_SHORT}|g" apps/demo-app/deployment.yaml
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/demo-app/deployment.yaml
          git commit -m "ci: update image tag to ${SHA_SHORT} [skip ci]"
          git push
